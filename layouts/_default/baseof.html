<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Tamana Documentation{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}">Tamana<span> / Docs</span></a>
      <nav aria-label="Main navigation">
        {{ range site.Menus.main }}
          <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </header>
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <p>Tamana · CSC 640 semester project documentation</p>
      <a href="https://github.com/tomboyloychoy/csc-640-tamana-documentation">Documentation source on GitHub</a>
    </footer>
  </body>
</html>
